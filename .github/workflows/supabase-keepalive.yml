name: Supabase Keep-Alive

# Free 플랜의 inactivity pause(7일 무활동 시 자동 정지) 방지용.
# 2026-05-05: ConnectTrip가 일시정지 경고 메일을 보내옴 → 6시간마다 다중 테이블 + Auth 쿼리로 강화.
# 2026-06-17: ElecDeal(가전딜) 프로젝트도 동일 경고 메일 → 같은 워크플로에서 두 프로젝트 동시 핑하도록 확장.
#   ConnectTrip : secrets.SUPABASE_URL / SUPABASE_ANON_KEY
#   ElecDeal    : secrets.ELECDEAL_URL / ELECDEAL_ANON_KEY
# URL secret이 비어 있으면 해당 프로젝트 핑은 스스로 skip한다.

on:
  schedule:
    - cron: '0 */6 * * *'  # 6시간마다 (00,06,12,18 UTC)
  workflow_dispatch:        # 수동 실행도 허용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ConnectTrip (travelers-hub)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ping_project() {
            local LABEL="$1" URL="$2" KEY="$3" TABLES="$4"
            if [ -z "$URL" ] || [ -z "$KEY" ]; then
              echo "[$LABEL] URL/KEY 미설정 → skip"; return 0
            fi
            echo "=== [$LABEL] keep-alive ping ==="
            for tbl in $TABLES; do
              STATUS=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                "$URL/rest/v1/$tbl?select=*&limit=1" || echo "000")
              echo "[$LABEL] $tbl: HTTP $STATUS"
              case "$STATUS" in
                200|206) echo "  -> ok" ;;
                404|406) echo "  -> 테이블 없음/스키마 차이 (skip)" ;;
                401|403) echo "  -> RLS 차단 (활동은 카운트됨)" ;;
                000)     echo "  -> 연결 실패" ;;
                *)       echo "  -> 예상 외 응답"; head -c 300 /tmp/body.txt; echo ;;
              esac
            done
            curl -sS -o /dev/null -w "[$LABEL] Auth health: HTTP %{http_code}\n" \
              "$URL/auth/v1/health" || echo "[$LABEL] Auth health: 연결 실패"
            curl -sS -o /dev/null -w "[$LABEL] Auth settings: HTTP %{http_code}\n" \
              -H "apikey: $KEY" "$URL/auth/v1/settings" || echo "[$LABEL] Auth settings: 연결 실패"
            echo "=== [$LABEL] done ==="
          }
          ping_project "ConnectTrip" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" \
            "regions profiles posts crew_posts dm_messages"

      - name: Ping ElecDeal (가전딜)
        if: always()
        env:
          ELECDEAL_URL: ${{ secrets.ELECDEAL_URL }}
          ELECDEAL_ANON_KEY: ${{ secrets.ELECDEAL_ANON_KEY }}
        run: |
          ping_project() {
            local LABEL="$1" URL="$2" KEY="$3" TABLES="$4"
            if [ -z "$URL" ] || [ -z "$KEY" ]; then
              echo "[$LABEL] URL/KEY 미설정 → skip"; return 0
            fi
            echo "=== [$LABEL] keep-alive ping ==="
            for tbl in $TABLES; do
              STATUS=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                "$URL/rest/v1/$tbl?select=*&limit=1" || echo "000")
              echo "[$LABEL] $tbl: HTTP $STATUS"
              case "$STATUS" in
                200|206) echo "  -> ok" ;;
                404|406) echo "  -> 테이블 없음/스키마 차이 (skip)" ;;
                401|403) echo "  -> RLS 차단 (활동은 카운트됨)" ;;
                000)     echo "  -> 연결 실패" ;;
                *)       echo "  -> 예상 외 응답"; head -c 300 /tmp/body.txt; echo ;;
              esac
            done
            curl -sS -o /dev/null -w "[$LABEL] Auth health: HTTP %{http_code}\n" \
              "$URL/auth/v1/health" || echo "[$LABEL] Auth health: 연결 실패"
            curl -sS -o /dev/null -w "[$LABEL] Auth settings: HTTP %{http_code}\n" \
              -H "apikey: $KEY" "$URL/auth/v1/settings" || echo "[$LABEL] Auth settings: 연결 실패"
            echo "=== [$LABEL] done ==="
          }
          ping_project "ElecDeal" "$ELECDEAL_URL" "$ELECDEAL_ANON_KEY" \
            "quote_requests bids deals awarded_records profiles"
