name: Planner Orphan Purge

# 플래너 티켓 고아 파일 정리 — 수동 실행 전용(workflow_dispatch).
# 회원 탈퇴·여행 삭제·티켓 삭제로 planner_tickets 행이 지워지면 DB 트리거가 저장 경로를
# planner_orphan_objects 큐에 넣는다. 매일 비우는 운영 경로는 서버리스 /api/planner/purge
# (Supabase pg_cron 이 Vault 토큰으로 호출)이고, 이 워크플로는 같은 로직을 손으로 돌릴 때만 쓴다.
# 예전엔 여기 schedule 이 있었지만 시크릿이 없어 매일 skip 하면서 초록 성공만 찍혔다(2026-09-05 제거).
#
# 필요한 시크릿(레포 Settings → Secrets and variables → Actions):
#   SUPABASE_URL                  (Supabase 키핑얼라이브 워크플로와 같은 값, 이미 등록돼 있음)
#   SUPABASE_SERVICE_ROLE_KEY     service_role 키 — 비공개 버킷과 큐 테이블 접근에 필요
# 시크릿이 비어 있으면 스크립트가 스스로 skip 하고 성공으로 끝난다(등록 전 매일 빨간불 방지).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제로 지우지 않고 대상 건수만 출력'
        type: boolean
        default: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Purge orphaned ticket objects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/planner_purge_orphans.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
