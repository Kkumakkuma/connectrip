  <!-- 폰트: 과거엔 index.css 의 @import 로 불러와 (HTML→번들CSS→폰트CSS→woff2) 4단 요청 체인이
       전부 렌더를 막았다. head 의 link 로 올려 폰트 CSS 를 번들 CSS 와 병렬로 받게 한다.
       preconnect 2줄 = 폰트 CSS(비-CORS)와 woff2(CORS)가 서로 다른 커넥션 풀을 쓰기 때문.
       static 판(가중치별 풀 woff2 약 770KB × 6종)이 아니라 variable dynamic-subset 판을 쓴다
       — unicode-range 로 실제 쓰인 글자 조각만 받는다. font-display:swap 은 이 CSS에 포함돼 있다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />

  <!-- 홈 카테고리 카드 6장이 images.unsplash.com 에서 온다. loading="lazy" 라 첫 페인트는 안 막지만
       스크롤이 닿는 순간 DNS+TLS 부터 시작해 6장이 한꺼번에 밀린다. 미리 커넥션을 열어 둔다.
       img 태그에 crossorigin 속성이 없어 비-CORS 요청이므로 preconnect 도 crossorigin 없이 건다
       (붙이면 다른 커넥션 풀이라 재사용되지 않는다). dns-prefetch 는 preconnect 미지원 대비 폴백. -->
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- 카카오 JS SDK(85.5KB / gzip 28.5KB)는 여기서 로드하지 않는다. 쓰는 곳이 ShareButtons 하나뿐이고
       그 컴포넌트는 lazy 라우트에만 붙어 있어, 홈·회원가입·마이페이지에서는 받아도 쓰이지 않았다.
       공유 메뉴를 열 때 ShareButtons.jsx 의 loadKakaoSdk() 가 동적으로 주입한다. -->

  <title>ConnectTrip - 여행자부터 승무원까지 모두를 연결하는 여행 정보 공유 플랫폼</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // 오래된 서비스워커·캐시 정리. 스테일 번들이 남는 것을 막는 장치다.
    // (앱(Capacitor)에서는 실행하지 않는다.)
    //
    // 2026-09-04: 전면 제거에서 **스코프 필터**로 바꿨다. 플래너는 /planner 스코프 전용
    // 서비스워커를 쓰는데(티켓 지갑 오프라인), 여기서 전부 지우면 매 로드마다
    // 등록→해제가 반복돼 캐시가 계속 날아간다. 이 인라인 스크립트는 defer module 보다
    // 먼저 도는 탓에 필터가 없으면 등록 자체가 의미를 잃는다.
    if ('serviceWorker' in navigator && !window.Capacitor?.isNativePlatform?.()) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(reg) {
          var scope = (reg.scope || '');
          if (scope.indexOf('/planner') === -1) reg.unregister();
        });
      });
      caches.keys().then(function(names) {
        names.forEach(function(name) {
          if (name.indexOf('ct-planner-') !== 0) caches.delete(name);
        });
      });
    }
  </script>
</body>
